<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" lang="en">
<ul>
    <f:for as="page" each="{menu}">
        <li>
            <f:if condition="{page.current}">
                <f:then>
                    <a aria-current="page" href="{page.link}">{page.title}</a>
                </f:then>
                <f:else>
                    <a href="{page.link}">{page.title}</a>
                </f:else>
            </f:if>
        </li>
    </f:for>
</ul>
</html>
